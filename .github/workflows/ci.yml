name: Data Quality CI Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start PostgreSQL Database
        run: docker compose up -d postgres_db

      - name: Wait for PostgreSQL to be ready
        run: sleep 5

      - name: Run Data Quality Checks and Log Results
        run: docker compose run --rm data_quality_runner