version: '3.8'

services:
  # Service 1 : Serveur de Base de Données
  postgres_db:
    image: postgres:15
    container_name: postgres_data_quality
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: data_quality_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # Volume pour persister les données de la DB
      - ./sql/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./sql/02_insert_data.sql:/docker-entrypoint-initdb.d/02_insert_data.sql

  # Service 2 : Exécuteur d'Audit & Analytics Python
  data_quality_runner:
    build: .
    container_name: python_data_quality
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: data_quality_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    volumes:
      - ./reports:/app/reports # Dossier local pour récupérer vos CSV
    depends_on:
      - postgres_db

# Déclaration du volume de la base de données
volumes:
  pgdata: